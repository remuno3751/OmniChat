[package]
name = "omnichat-server-app"
version = "1.1.0"
description = "OmniChat Server: runs and manages the OmniChat server"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "omnichat_server_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["json"] }

[target.'cfg(windows)'.dependencies]
# 0.61 is the version already in Cargo.lock (no new download); the Job Object API is the same.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
