[package]
name = "omnichat-desktop"
version = "0.4.0-1"
description = "OmniChat desktop launcher"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "omnichat_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["platform-verifier"] }
url = "2"
sha2 = "0.10"

# Dock icon switching (same versions tauri already pulls in).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSImage"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
