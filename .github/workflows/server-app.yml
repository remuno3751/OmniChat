name: Server App

# Builds "OmniChat Server" (server-app/): the Tauri app that runs and manages the server on Windows and Linux.
# Tags (v*) build installers and attach them to the release of that tag (release.yml creates it as a DRAFT; if this
# workflow is faster it creates the same kind of draft). Pull requests that touch server-app/ only run the checks.
# Manual only (Actions > Run workflow): the free CI minutes of the private repo are nearly used up, so nothing starts on push / tag / pull request.
# Re-enable the triggers (push tags: ["v*"] ...) when the repo is public or the quota is raised. Releases are built locally (packaging/local/).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to attach assets to, e.g. v1.2.3 (empty = build only)"
        required: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}

jobs:
  check:
    name: Rust tests (linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 2026-10-17 (branch)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server-app/src-tauri
      - name: Placeholder bundle (resources must exist to compile)
        run: mkdir -p server-app/src-tauri/bundle/server
      - run: cargo test --locked
        working-directory: server-app/src-tauri

  build:
    name: ${{ matrix.name }}
    if: github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64, os: windows-latest, args: "--bundles nsis" }
          - { name: linux-x64, os: ubuntu-22.04, args: "--bundles appimage,deb" }
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.TAG || github.sha }}
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable 2026-10-17 (branch)

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: server-app/src-tauri

      - name: Stamp version from tag
        if: env.TAG != ''
        shell: bash
        run: node desktop/tools/set-version.mjs "$TAG" server-app

      - name: Install JS deps (web app, server, server-app)
        shell: bash
        run: |
          (cd app && npm ci --no-audit --no-fund)
          (cd server && npm ci --no-audit --no-fund)
          (cd server-app && npm ci --no-audit --no-fund)

      - name: Bundle the server (web UI + dist + production deps + this runner's Node)
        run: node server-app/tools/prepare-bundle.mjs

      - name: Rust tests
        run: cargo test
        working-directory: server-app/src-tauri

      - name: Build installers
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        with:
          projectPath: server-app
          args: ${{ matrix.args }}

      - name: Collect and name artifacts
        shell: bash
        env:
          LABEL: ${{ env.TAG || format('dev-{0}', github.sha) }}
        run: |
          set -euo pipefail
          label="${LABEL:0:24}"
          mkdir -p out
          while IFS= read -r f; do
            base=$(basename "$f")
            ext="${base##*.}"
            case "$base" in
              *.exe) plat=Windows-x64-Setup ;;
              *) plat=Linux-x64 ;;
            esac
            cp "$f" "out/OmniChat-Server-App-${label}-${plat}.${ext}"
            # version-less alias (see desktop.yml)
            cp "$f" "out/OmniChat-Server-App-${plat}.${ext}"
          done < <(find server-app/src-tauri/target -type f \( -path '*/bundle/nsis/*.exe' -o -path '*/bundle/appimage/*.AppImage' -o -path '*/bundle/deb/*.deb' \) | sort)
          ls -l out
          test -n "$(ls out)"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: server-app-${{ matrix.name }}
          path: out/*
          retention-days: 7

  publish:
    name: Attach to GitHub Release
    needs: build
    if: github.event_name != 'pull_request' && startsWith(github.event.inputs.tag || github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          pattern: server-app-*
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: |
          ls -l
          sha256sum -- OmniChat-Server-App-* > SHA256SUMS-server-app.txt
          cat SHA256SUMS-server-app.txt
          # per-asset checksum file next to each installer: "<hex>  <name>" (the updater accepts this form)
          for f in OmniChat-Server-App-*; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256) continue ;; esac
            printf '%s  %s\n' "$(sha256sum -- "$f" | cut -d' ' -f1)" "$f" > "$f.sha256"
          done
          ls -l
      - name: Create draft release if absent, then upload
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          T: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          pre=""; case "$T" in *-*) pre="--prerelease" ;; esac
          for i in 1 2 3 4 5 6; do
            gh release view "$T" --repo "$REPO" >/dev/null 2>&1 && break
            if [ "$i" = 6 ]; then
              # shellcheck disable=SC2086
              gh release create "$T" --repo "$REPO" --draft $pre --title "OmniChat $T" --generate-notes --verify-tag
            else
              sleep 20
            fi
          done
          gh release upload "$T" --repo "$REPO" --clobber artifacts/*
